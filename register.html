<span class="tag-badge">إنشاء حساب جديد</span>
<h1 class="main-title">انضم إلى منصة بصيرة</h1>
<p class="intro-text">حدد نوع حسابك لإكمال عملية التسجيل والوصول للخدمات المخصصة لك.</p>

<div class="registration-wrapper">
  
  <!-- صندوق التنبيه بالأخطاء والنجاح -->
  <div id="alertBox" class="alert-box" style="display: none; padding: 12px; margin-bottom: 15px; border-radius: 8px; font-weight: 600; text-align: center;"></div>

  <!-- نموذج التسجيل الرئيسي -->
  <form class="auth-form" id="registerForm" novalidate>
  
    <div class="role-selector">
      <input type="radio" id="role-parent" name="account_role" value="parent" checked hidden>
      <label for="role-parent" class="role-tab tab-parent"><span>👨‍👩‍👧‍👦</span> ولي أمر</label>

      <input type="radio" id="role-specialist" name="account_role" value="specialist" hidden>
      <label for="role-specialist" class="role-tab tab-specialist"><span>🩺</span> أخصائي معتمد</label>
    </div>

    <div class="form-group">
      <label for="fullName">الاسم الكامل</label>
      <input type="text" id="fullName" name="fullName" placeholder="أدخل اسمك الكامل" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="regEmail">البريد الإلكتروني</label>
        <input type="email" id="regEmail" name="email" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label for="phone">رقم الهاتف</label>
        <input type="tel" id="phone" name="phone" placeholder="06XXXXXXXX" required>
      </div>
    </div>

    <div class="role-fields specialist-fields" id="specialistFields" style="display: none;">
      <div class="form-group">
        <label for="specialty">التخصص الطبي / النفسي</label>
        <select id="specialty" name="specialty">
          <option value="">اختر التخصص</option>
          <option value="psychologist">🧠 أخصائي نفساني</option>
          <option value="speech_therapist">🗣️ أخصائي أرطوفوني (تخاطب)</option>
          <option value="ophthalmologist">👁️ أخصائي عيون</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" id="btnStartRegister" class="cta-button submit-btn">إنشاء الحساب 🚀</button>
  </form>

  <!-- النافذة المنبثقة للـ OTP -->
  <div id="otpModal" class="modal hidden" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 9999;">
  <div class="modal-content" style="background: #fff; padding: 25px; border-radius: 12px; max-width: 380px; width: 90%; text-align: center; position: relative;">
    <span class="close-btn" id="closeOtpModal" style="position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 1.5rem;">&times;</span>
    <h3>تأكيد البريد الإلكتروني</h3>
    <p style="font-size: 0.88rem; color: #666; margin: 10px 0;">
      تم إرسال رمز التحقق إلى: <br><strong id="displayTargetEmail" style="color: #4a90e2;"></strong>
    </p>

    <!-- تم حذف وسم form لتجنب أي إرسال افتراضي متصفحي -->
    <div class="form-group">
      <input type="text" id="otpInput" name="otp_code" maxlength="6" required placeholder="أدخل الرمز (6 أرقام)" style="text-align: center; font-size: 1.2rem; letter-spacing: 4px; width: 100%; padding: 8px; margin-top: 10px;">
    </div>
    
    <!-- إضافة id="btnVerifyOtp" بوضوح ليتعرف عليه الجافاسكريبت -->
    <button type="button" id="btnVerifyOtp" class="cta-button submit-btn" style="width: 100%; margin-top: 15px;">تأكيد وإنشاء الحساب ✅</button>
    
    <div style="margin-top: 10px;">
      <button type="button" id="resendOtpBtn" style="background: none; border: none; color: #4a90e2; cursor: pointer; text-decoration: underline; font-size: 0.85rem;">إعادة إرسال الرمز 🔄</button>
    </div>
  </div>
</div>
  <div class="form-footer" style="margin-top: 15px; text-align: center;">
    لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
  </div>
</div>
