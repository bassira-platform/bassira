<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة البطل الصغير - رحلة الاستكشاف</title>
    <!-- مكتبات Phaser 3 + WebGazer + Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #090d16; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        #webgazerVideoFeed, #webgazerVideoCanvas, #webgazerFaceOverlay, #webgazerFaceFeedbackBox { display: none !important; }
        .game-overlay { position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="ui-overlay" class="game-overlay bg-slate-950/90 backdrop-blur-md">
    <div class="max-w-md w-full bg-slate-900 border border-indigo-500/30 rounded-3xl p-8 text-center shadow-2xl">
        <div class="w-20 h-20 bg-indigo-600/20 rounded-full flex items-center justify-center mx-auto mb-6 border border-indigo-500/40">
            <span class="text-4xl">🚀</span>
        </div>
        <h1 class="text-3xl font-black text-white mb-3">مغامرة الاستكشاف البصري</h1>
        <p class="text-slate-400 text-sm mb-6 leading-relaxed">
            ساعد البطل في جمع النجوم واستكشاف الغابة. يرجى الجلوس أمام الكاميرا بوضوح.
        </p>
        <button id="start-btn" onclick="startGameEngine()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-lg rounded-2xl shadow-lg transition-all transform active:scale-95">
            ابدأ المغامرة الآن
        </button>
    </div>
</div>

<div id="phaser-game"></div>

<script>
// ==========================================
// 1. المتغيرات والبيانات الطبية (DSM-5 Metrics)
// ==========================================
let childId = new URLSearchParams(window.location.search).get('child_id') || 6;
let gazeTracker = { x: window.innerWidth / 2, y: window.innerHeight / 2, active: false };
let gazeMetrics = {
    socialFixationMs: 0,
    nonSocialFixationMs: 0,
    saccadeDistances: [],
    lastPos: null,
    gazeLogs: []
};

// ==========================================
// 2. محرك اللعبة الرئيسي Phaser 3
// ==========================================
const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    parent: 'phaser-game',
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: [CalibrationScene, ASDTestScene, SLDTestScene, EndScene]
};

let game;

async function startGameEngine() {
    document.getElementById('ui-overlay').style.display = 'none';
    
    // تشغيل محرك الألعاب أولاً
    game = new Phaser.Game(config);

    // تهيئة WebGazer مع تفادي أخطاء الاستضافة 404
    try {
        // إيقاف التتبع التجريبي القديم لتجنب تعارض الـ Promises
        if (typeof webgazer !== 'undefined') {
            await webgazer.setRegression('ridge') /* استخدام خوارزمية Ridge المستقرة بدلاً من النماذج الثقيلة */
                .setTracker('TBM') /* أسلوب تتبع أخف وزناً لمنع أخطاء face_mesh */
                .setGazeListener((data, elapsedTime) => {
                    if (data) {
                        gazeTracker.x = data.x;
                        gazeTracker.y = data.y;
                        
                        if (gazeTracker.active) {
                            gazeMetrics.gazeLogs.push({ x: Math.round(data.x), y: Math.round(data.y), t: elapsedTime });
                            
                            if (gazeMetrics.lastPos) {
                                let dist = Phaser.Math.Distance.Between(data.x, data.y, gazeMetrics.lastPos.x, gazeMetrics.lastPos.y);
                                gazeMetrics.saccadeDistances.push(dist);
                            }
                            gazeMetrics.lastPos = { x: data.x, y: data.y };
                        }
                    }
                }).begin();

            webgazer.showPredictionPoints(false);
            webgazer.showVideo(false);
        }
    } catch (err) {
        console.warn("تنبيه: تعذر تحميل تتبع العين الكامل، يتم الآن التشغيل في وضع التفاعل المباشر:", err);
    }
}

// ==========================================
// Scene 1: مرحلة المعايرة التفاعلية (Calibration)
// ==========================================
class CalibrationScene extends Phaser.Scene {
    constructor() { super('CalibrationScene'); }

    create() {
        this.add.text(this.cameras.main.centerX, 80, 'اتبع النجمة السحرية بنظرك واضغط عليها', {
            fontSize: '26px', color: '#38bdf8', fontStyle: 'bold'
        }).setOrigin(0.5);

        this.dots = [
            {x: 0.15, y: 0.2}, {x: 0.5, y: 0.2}, {x: 0.85, y: 0.2},
            {x: 0.15, y: 0.5}, {x: 0.5, y: 0.5}, {x: 0.85, y: 0.5},
            {x: 0.15, y: 0.8}, {x: 0.5, y: 0.8}, {x: 0.85, y: 0.8}
        ];
        this.currentIndex = 0;
        this.clicks = 0;

        this.star = this.add.circle(0, 0, 30, 0xf59e0b).setInteractive();
        this.star.setStrokeStyle(4, 0xffffff);
        
        this.tweens.add({ targets: this.star, scale: 1.2, duration: 600, yoyo: true, repeat: -1 });
        this.updateStarPosition();

        this.star.on('pointerdown', (pointer) => {
            // استخدام موضع النقر كمؤشر احتياطي في حال عدم استجابة الكاميرا
            gazeTracker.x = pointer.x;
            gazeTracker.y = pointer.y;

            this.clicks++;
            if (this.clicks >= 3) {
                this.clicks = 0;
                this.currentIndex++;
                if (this.currentIndex >= this.dots.length) {
                    gazeTracker.active = true;
                    this.scene.start('ASDTestScene');
                } else {
                    this.updateStarPosition();
                }
            }
        });
    }

    updateStarPosition() {
        let p = this.dots[this.currentIndex];
        this.star.setPosition(p.x * this.scale.width, p.y * this.scale.height);
    }
}

// ==========================================
// Scene 2: اختبار التوحد DSM-5 (ASD Visual Preference)
// ==========================================
class ASDTestScene extends Phaser.Scene {
    constructor() { super('ASDTestScene'); }

    create() {
        this.add.text(this.cameras.main.centerX, 60, 'استكشف المشهد البصري حرّاً...', {
            fontSize: '24px', color: '#f8fafc'
        }).setOrigin(0.5);

        // المثير الاجتماعي
        this.socialContainer = this.add.container(this.scale.width * 0.25, this.scale.height * 0.5);
        let faceBg = this.add.circle(0, 0, 110, 0x38bdf8);
        let eye1 = this.add.circle(-40, -30, 15, 0x0f172a);
        let eye2 = this.add.circle(40, -30, 15, 0x0f172a);
        let smile = this.add.arc(0, 20, 50, 0, 180, false, 0x0f172a).setStrokeStyle(6, 0x0f172a);
        this.socialContainer.add([faceBg, eye1, eye2, smile]);

        // المثير الهندسي غير الاجتماعي
        this.geoContainer = this.add.container(this.scale.width * 0.75, this.scale.height * 0.5);
        let rect1 = this.add.rectangle(0, 0, 180, 180, 0x8b5cf6);
        let rect2 = this.add.rectangle(0, 0, 120, 120, 0xec4899);
        this.geoContainer.add([rect1, rect2]);

        this.tweens.add({ targets: [rect1, rect2], angle: 360, duration: 4000, repeat: -1 });

        // تتبع مؤشر الماوس بصفة احتياطية عند غياب التتبع البصري
        this.input.on('pointermove', (pointer) => {
            if (!gazeTracker.active) {
                gazeTracker.x = pointer.x;
                gazeTracker.y = pointer.y;
            }
        });

        this.time.delayedCall(10000, () => {
            this.scene.start('SLDTestScene');
        });
    }

    update(time, delta) {
        let socialBounds = new Phaser.Geom.Circle(this.scale.width * 0.25, this.scale.height * 0.5, 150);
        let geoBounds = new Phaser.Geom.Rectangle(this.scale.width * 0.75 - 100, this.scale.height * 0.5 - 100, 200, 200);

        if (socialBounds.contains(gazeTracker.x, gazeTracker.y)) {
            gazeMetrics.socialFixationMs += delta;
        } else if (geoBounds.contains(gazeTracker.x, gazeTracker.y)) {
            gazeMetrics.nonSocialFixationMs += delta;
        }
    }
}

// ==========================================
// Scene 3: اختبار عسر التعلم DSM-5 (SLD Tracking)
// ==========================================
class SLDTestScene extends Phaser.Scene {
    constructor() { super('SLDTestScene'); }

    create() {
        this.add.text(this.cameras.main.centerX, 60, 'تتبع الرمز المتحرك بعينيك بدقة', {
            fontSize: '24px', color: '#f8fafc'
        }).setOrigin(0.5);

        this.letters = ['ب', 'ت', 'ث', 'ك', 'م'];
        this.letterIndex = 0;

        this.label = this.add.text(this.scale.width / 2, this.scale.height / 2, 'ب', {
            fontSize: '110px', color: '#f43f5e', fontStyle: 'bold'
        }).setOrigin(0.5);

        this.tweens.add({
            targets: this.label,
            x: { value: this.scale.width - 200, duration: 3000, ease: 'Sine.easeInOut', yoyo: true, repeat: -1 },
            y: { value: this.scale.height - 200, duration: 2000, ease: 'Sine.easeInOut', yoyo: true, repeat: -1 }
        });

        this.time.addEvent({
            delay: 2500,
            repeat: 4,
            callback: () => {
                this.letterIndex++;
                if (this.letterIndex < this.letters.length) {
                    this.label.setText(this.letters[this.letterIndex]);
                } else {
                    this.scene.start('EndScene');
                }
            }
        });
    }
}

// ==========================================
// Scene 4: المعالجة وإرسال التقرير التشخيصي
// ==========================================
class EndScene extends Phaser.Scene {
    constructor() { super('EndScene'); }

    create() {
        gazeTracker.active = false;
        try { if (typeof webgazer !== 'undefined') webgazer.end(); } catch(e){}

        let totalMs = gazeMetrics.socialFixationMs + gazeMetrics.nonSocialFixationMs;
        let socialScore = totalMs > 0 ? (gazeMetrics.socialFixationMs / totalMs) : 0.5;

        let asdStatus = 'LOW_RISK';
        if (socialScore < 0.35) asdStatus = 'HIGH_RISK';
        else if (socialScore < 0.50) asdStatus = 'MODERATE_RISK';

        let avgSaccade = gazeMetrics.saccadeDistances.length > 0 ? 
            (gazeMetrics.saccadeDistances.reduce((a,b)=>a+b, 0) / gazeMetrics.saccadeDistances.length) : 0;
        
        let sldStatus = 'LOW_RISK';
        if (avgSaccade > 160) sldStatus = 'HIGH_RISK';
        else if (avgSaccade > 110) sldStatus = 'MODERATE_RISK';

        // إرسال النتيجة إلى قاعدة البيانات
        fetch('/api/save_game_result.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                child_id: childId,
                game_id: 1,
                social_preference_score: socialScore.toFixed(2),
                fixation_duration_ms: Math.round(totalMs),
                saccade_velocity: avgSaccade.toFixed(2),
                asd_indicator: asdStatus,
                sld_indicator: sldStatus,
                raw_gaze_data: gazeMetrics.gazeLogs.slice(0, 200)
            })
        });

        this.add.text(this.scale.width / 2, this.scale.height / 2, 'تم إكمال التقييم بنجاح! 🏆\nجاري حفظ البيانات في ملفك الطبي...', {
            fontSize: '28px', color: '#10b981', align: 'center', fontStyle: 'bold'
        }).setOrigin(0.5);
    }
}
</script>
</body>
</html>
