<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - منصة بصيرة</title>
  <!-- خط Cairo من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-log.css">
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <span class="brand-badge">منصة بصيرة</span>
      <h1>تسجيل الدخول</h1>
      <p>أدخل بياناتك للوصول إلى لوحة التحكم</p>
    </div>

    <!-- صندوق التنبيه بالأخطاء -->
    <div id="alertBox" class="alert-box"></div>

    <form id="loginForm" action="login.php" method="POST" novalidate>
      
      <!-- البريد الإلكتروني أو رمز المستخدم -->
      <div class="form-group">
        <label for="identifier">البريد الإلكتروني أو رمز الحساب</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="identifier" 
            name="identifier" 
            class="form-control" 
            placeholder="مثال: P00001 أو example@mail.com" 
            required
          >
        </div>
      </div>

      <!-- كلمة المرور -->
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required
          >
        </div>
      </div>

      <!-- تذكرني ونسيت كلمة المرور -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember" name="remember">
          تذكرني على هذا الجهاز
        </label>
        <a href="#" id="openForgotPassword" class="forgot-link">نسيت كلمة المرور؟</a>
      </div>

      <!-- زر الدخول -->
      <button type="submit" class="btn-submit">
        دخول إلى الحساب 🔑
      </button>

    </form>

    <div class="form-footer">
      ليس لديك حساب بعد؟ 
<a href="index.html#register">إنشاء حساب جديد</a>
    </div>

    <a href="index.html" class="back-home">← العودة للرئيسية</a>
  </div>

  <script src="script-log.js">
  </script>
<!-- رابط نسيت كلمة المرور يُوضع داخل نموذج الدخول -->
<!-- <a href="#" id="openForgotPassword">نسيت كلمة المرور؟</a> -->

<!-- 1. نافذة طلب البريد الإلكتروني -->
<div id="forgotPasswordModal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <span class="close-modal" id="closeForgotModal">&times;</span>
    <h3>استعادة كلمة المرور 🔐</h3>
    <p>أدخل بريدك الإلكتروني المسجل لنرسل لك رمز التحقق (OTP).</p>
    
    <form id="forgotPasswordForm">
      <div class="input-group">
        <input type="email" id="forgotEmail" placeholder="البريد الإلكتروني" required />
      </div>
      <button type="submit" id="btnSendForgotOtp" class="btn-primary">إرسال رمز التحقق 📩</button>
    </form>
  </div>
</div>

<!-- 2. نافذة الـ OTP المكونة من 6 خانات وكلمة المرور الجديدة -->
<div id="resetPasswordModal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <span class="close-modal" id="closeResetModal">&times;</span>
    <h3>تغيير كلمة المرور 🔑</h3>
    <p>أدخل رمز التحقق المكون من 6 أرقام:</p>
    
    <!-- حقول OTP المقسمة -->
    <div class="otp-container" dir="ltr">
      <input type="text" maxlength="1" class="otp-field" pattern="\d*" inputmode="numeric" />
      <input type="text" maxlength="1" class="otp-field" pattern="\d*" inputmode="numeric" />
      <input type="text" maxlength="1" class="otp-field" pattern="\d*" inputmode="numeric" />
      <input type="text" maxlength="1" class="otp-field" pattern="\d*" inputmode="numeric" />
      <input type="text" maxlength="1" class="otp-field" pattern="\d*" inputmode="numeric" />
      <input type="text" maxlength="1" class="otp-field" pattern="\d*" inputmode="numeric" />
    </div>

    <!-- نموذج كلمة المرور الجديدة -->
    <form id="resetPasswordForm" style="margin-top: 1.5rem;">
      <div class="input-group">
        <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة" required />
      </div>
      <div class="input-group">
        <input type="password" id="confirmNewPassword" placeholder="تأكيد كلمة المرور الجديدة" required />
      </div>
      <button type="submit" id="btnResetPassword" class="btn-primary">تحديث كلمة المرور 🚀</button>
    </form>
  </div>
</div>

<script src="forgot-password.js"></script>
</body>
</html>
