<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حديقة الأشكال والألوان - للأطفال 3 سنوات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; overflow: hidden; text-align: center; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: linear-gradient(180deg, #0284c7 0%, #0f172a 100%); }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .card { background: rgba(15, 23, 42, 0.95); border: 3px solid #38bdf8; border-radius: 24px; padding: 30px; max-width: 480px; margin: 15vh auto; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        h1 { color: #facc15; font-size: 32px; margin-bottom: 15px; }
        p { font-size: 20px; line-height: 1.6; color: #e2e8f0; margin-bottom: 25px; }
        .btn { background: #10b981; color: white; border: none; padding: 16px 40px; font-size: 24px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: transform 0.2s, background 0.2s; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4); }
        .btn:hover { transform: scale(1.05); background: #059669; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <!-- شاشة البداية -->
        <div id="startCard" class="card interactive">
            <h1>حديقة الألوان 🎈</h1>
            <p>مرحباً يا بطل! اضغط على البالونات الملصقة على الأشكال الجميلة لتجميع النقاط والاحتفال!</p>
            <button class="btn" onclick="startGame()">إبدأ اللعب 🚀</button>
        </div>

        <!-- شاشة النهاية -->
        <div id="endCard" class="card interactive" style="display: none;">
            <h1>ممتاز جداً! 🏆</h1>
            <p id="statusMsg">أنت بطل رائع! تم حفظ النتيجة بنجاح.</p>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const urlParams = new URLSearchParams(window.location.search);
const childId = urlParams.get('child_id') || 6;

let stage = 'START'; // START, PLAY, END
let balloons = [];
let score = 0;
let totalTaps = 0;
let startTime = 0;
let interactions = [];

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// توليد بالونات ملونة بسيطة تناسب عمر 3 سنوات
function createBalloon() {
    const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
    const shapes = ['circle', 'square'];
    return {
        x: Math.random() * (canvas.width - 120) + 60,
        y: canvas.height + 60,
        radius: 45 + Math.random() * 15,
        color: colors[Math.floor(Math.random() * colors.length)],
        shape: shapes[Math.floor(Math.random() * shapes.length)],
        speed: 1.5 + Math.random() * 1.5
    };
}

function startGame() {
    document.getElementById('startCard').style.display = 'none';
    stage = 'PLAY';
    score = 0;
    totalTaps = 0;
    balloons = [];
    startTime = Date.now();

    // إنشاء بالونات كل فترة
    for(let i = 0; i < 4; i++) balloons.push(createBalloon());

    // إنهاء اللعبة تلقائياً بعد 30 ثانية (مدة مناسبة للطفل)
    setTimeout(finishGame, 30000);

    requestAnimationFrame(gameLoop);
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (stage === 'PLAY') {
        // رسم النتيجة في الأعلى
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px Segoe UI';
        ctx.fillText(`النقاط: ${score} ⭐️`, 40, 50);

        // تحديث ورسم البالونات
        balloons.forEach((b, index) => {
            b.y -= b.speed;

            ctx.fillStyle = b.color;
            ctx.beginPath();
            if (b.shape === 'circle') {
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            } else {
                ctx.roundRect(b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2, 15);
            }
            ctx.fill();

            // خيط البالون
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(b.x, b.y + b.radius);
            ctx.lineTo(b.x, b.y + b.radius + 30);
            ctx.stroke();

            // اعادة البالون للأصل عند الخروج
            if (b.y < -60) {
                balloons[index] = createBalloon();
            }
        });

        requestAnimationFrame(gameLoop);
    }
}

// التفاعل باللمس أو الضغط
canvas.addEventListener('pointerdown', (e) => {
    if (stage !== 'PLAY') return;

    totalTaps++;
    let hit = false;

    balloons.forEach((b, index) => {
        let dist = Math.hypot(e.clientX - b.x, e.clientY - b.y);
        if (dist < b.radius + 15) {
            score++;
            hit = true;
            interactions.push({ x: e.clientX, y: e.clientY, time: Date.now() - startTime, success: true });
            balloons[index] = createBalloon(); // فرقعة البالون وإنشاء جديد
        }
    });

    if (!hit) {
        interactions.push({ x: e.clientX, y: e.clientY, time: Date.now() - startTime, success: false });
    }
});

function finishGame() {
    stage = 'END';
    document.getElementById('endCard').style.display = 'block';

    let accuracy = totalTaps > 0 ? (score / totalTaps).toFixed(2) : 0;

    // حفظ التقرير في السيرفر بدون أخطاء
    fetch('save_game_result.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            child_id: childId,
            game_id: 3,
            social_preference_score: accuracy,
            fixation_duration_ms: 30000,
            saccade_velocity: score,
            asd_indicator: score >= 8 ? 'LOW_RISK' : 'MODERATE_RISK',
            sld_indicator: accuracy > 0.5 ? 'LOW_RISK' : 'MODERATE_RISK',
            raw_gaze_data: interactions
        })
    })
    .then(res => res.json())
    .then(() => {
        document.getElementById('statusMsg').innerText = "أحسنت! تم حفظ نتائج اللعبة في ملف الطفل بنجاح 🌟";
    })
    .catch(() => {
        document.getElementById('statusMsg').innerText = "أحسنت يا بطل! لعب ممتاز جداً 🎉";
    });
}
</script>
</body>
</html>
