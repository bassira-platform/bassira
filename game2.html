<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حديقة الأشكال والألوان - للأطفال 3 سنوات</title>
    <!-- تضمين وحدة إدارة الكاميرا -->
    <script src="camera_manager.js"></script>
<style>
    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        user-select: none; 
        -webkit-user-select: none;
        touch-action: manipulation;
    }
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background: #0f172a; 
        color: #fff; 
        overflow: hidden; 
        text-align: center; 
        width: 100vw;
        height: 100vh;
    }
    #game-container { 
        position: relative; 
        width: 100%; 
        height: 100%; 
        background: linear-gradient(180deg, #0284c7 0%, #0f172a 100%); 
    }
    canvas { 
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100%;
        height: 100%;
        z-index: 1; 
    }
    .ui-layer { 
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        z-index: 10; 
        pointer-events: none; 
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .interactive { pointer-events: auto; }
    .card { 
        background: rgba(15, 23, 42, 0.95); 
        border: 3px solid #38bdf8; 
        border-radius: 24px; 
        padding: 24px; 
        max-width: 440px; 
        width: 100%; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        margin: auto;
    }
    h1 { color: #facc15; font-size: clamp(22px, 5vw, 30px); margin-bottom: 12px; }
    p { font-size: clamp(16px, 4vw, 18px); line-height: 1.5; color: #e2e8f0; margin-bottom: 20px; }
    .btn { 
        background: #10b981; 
        color: white; 
        border: none; 
        padding: 14px 32px; 
        font-size: clamp(18px, 4vw, 22px); 
        font-weight: bold; 
        border-radius: 50px; 
        cursor: pointer; 
        transition: transform 0.2s, background 0.2s; 
        box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4); 
    }
    .btn:hover { transform: scale(1.05); background: #059669; }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div id="startCard" class="card interactive">
            <h1>حديقة الألوان 🎈</h1>
            <p>مرحباً يا بطل! اضغط على البالونات الملصقة على الأشكال الجميلة لتجميع النقاط والاحتفال!</p>
            <button class="btn" onclick="startGame()">إبدأ اللعب 🚀</button>
        </div>

        <div id="endCard" class="card interactive" style="display: none;">
            <h1>ممتاز جداً! 🏆</h1>
            <p id="statusMsg">أنت بطل رائع! جاري حفظ النتيجة...</p>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const urlParams = new URLSearchParams(window.location.search);
const childId = parseInt(urlParams.get('child_id')) || 6;

let stage = 'START'; 
let balloons = [];
let score = 0;
let totalTaps = 0;
let startTime = 0;
let interactions = [];

function resize() { 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight; 
}
window.addEventListener('resize', resize);
resize();

function createBalloon() {
    const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
    const shapes = ['circle', 'square'];
    const minRadius = Math.min(canvas.width, canvas.height) * 0.08;
    return {
        x: Math.random() * (canvas.width - 120) + 60,
        y: canvas.height + 60,
        radius: Math.max(35, minRadius),
        color: colors[Math.floor(Math.random() * colors.length)],
        shape: shapes[Math.floor(Math.random() * shapes.length)],
        speed: 1.2 + Math.random() * 1.3
    };
}

async function startGame() {
    if (window.CameraManager) {
        await window.CameraManager.start();
    }

    document.getElementById('startCard').style.display = 'none';
    stage = 'PLAY';
    score = 0;
    totalTaps = 0;
    balloons = [];
    interactions = [];
    startTime = Date.now();

    for(let i = 0; i < 4; i++) balloons.push(createBalloon());

    setTimeout(finishGame, 30000);
    requestAnimationFrame(gameLoop);
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (stage === 'PLAY') {
        let safeX = Math.max(20, canvas.width * 0.05);
        let safeY = Math.max(30, canvas.height * 0.08);

        ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
        if (ctx.roundRect) {
            ctx.beginPath();
            ctx.roundRect(safeX, safeY - 25, 150, 45, 12);
            ctx.fill();
        } else {
            ctx.fillRect(safeX, safeY - 25, 150, 45);
        }

        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 20px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(`النقاط: ${score} ⭐️`, safeX + 75, safeY + 5);
        ctx.textAlign = 'start'; 

        balloons.forEach((b, index) => {
            b.y -= b.speed;

            ctx.fillStyle = b.color;
            ctx.beginPath();
            if (b.shape === 'circle') {
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            } else {
                if (ctx.roundRect) {
                    ctx.roundRect(b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2, 12);
                } else {
                    ctx.rect(b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2);
                }
            }
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(b.x, b.y + b.radius);
            ctx.lineTo(b.x, b.y + b.radius + 25);
            ctx.stroke();

            if (b.y < -60) {
                balloons[index] = createBalloon();
            }
        });

        requestAnimationFrame(gameLoop);
    }
}

canvas.addEventListener('pointerdown', (e) => {
    if (stage !== 'PLAY') return;

    totalTaps++;
    let hit = false;

    balloons.forEach((b, index) => {
        let dist = Math.hypot(e.clientX - b.x, e.clientY - b.y);
        if (dist < b.radius + 15) {
            score++;
            hit = true;
            interactions.push({ x: Math.round(e.clientX), y: Math.round(e.clientY), time: Date.now() - startTime, hit: 1 });
            balloons[index] = createBalloon();
        }
    });

    if (!hit) {
        interactions.push({ x: Math.round(e.clientX), y: Math.round(e.clientY), time: Date.now() - startTime, hit: 0 });
    }
});

async function finishGame() {
    stage = 'END';
    document.getElementById('endCard').style.display = 'block';

    if (window.CameraManager) {
        await window.CameraManager.stop();
    }

    let accuracy = totalTaps > 0 ? parseFloat((score / totalTaps).toFixed(2)) : 0;

    const payload = {
        child_id: childId,
        game_id: 3,
        social_preference_score: accuracy,
        fixation_duration_ms: 30000,
        saccade_velocity: score,
        asd_indicator: score >= 8 ? 'LOW_RISK' : 'MODERATE_RISK',
        sld_indicator: accuracy > 0.5 ? 'LOW_RISK' : 'MODERATE_RISK',
        raw_gaze_data: interactions.slice(0, 50)
    };

    fetch('save_game_result.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(async res => {
        if (!res.ok) throw new Error('HTTP status ' + res.status);
        return res.json();
    })
    .then(() => {
        document.getElementById('statusMsg').innerText = "أحسنت! تم حفظ نتائج اللعبة في ملف الطفل بنجاح 🌟";
    })
    .catch(() => {
        document.getElementById('statusMsg').innerText = "أحسنت يا بطل! لعب ممتاز جداً 🎉";
    });
}
</script>
</body>
</html>
